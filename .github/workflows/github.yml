name: Run RetailGenius Pipeline in Docker

on:
  push:
    branches:
      - main

jobs:
  run-docker:
    runs-on: ubuntu-latest

    env:                   
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Build Docker image
      - name: Build Docker image
        run: docker build -t retailgenius:latest .

      # Step 3: Run Docker container
      - name: Run main.py inside Docker
        run: docker run --rm -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} retailgenius:latest
