name: Run RetailGenius Pipeline in Docker

on:
  push:
    branches:
      - main

jobs:
  run-docker:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Build Docker image
      - name: Build Docker image
        run: docker build -t retailgenius:latest .

      # Step 3: Run main.py inside Docker
      - name: Run main.py
        run: docker run --rm -e OPENAI_API_KEY="$OPENAI_API_KEY" -e INPUT_PATH=data/raw/reviews.json retailgenius:latest

